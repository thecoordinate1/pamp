name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint, every test, then a production build. The tests include the database
      # suites in tests/db, which run the real migrations in PGlite (Postgres in
      # WebAssembly), so no Supabase project or Docker is needed.
      - name: Lint, test and build
        run: npm run check
